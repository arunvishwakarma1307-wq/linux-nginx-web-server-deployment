upstream backend_cluster {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

server {
    listen 80;
    listen [::]:80;
    server_name sitea.local;

    # Phase 7 proxy buffer and timeout configuration
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://backend_cluster;

        # Intercept upstream 5xx responses for custom error handling
        proxy_intercept_errors on;

        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Phase 5 HTTP Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Phase 7 custom upstream error handling
    error_page 500 502 503 504 /custom_50x.html;

    location = /custom_50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

server {
    listen 127.0.0.1:8081;
    root /var/www/node1/html;
    index index.html;
}

server {
    listen 127.0.0.1:8082;
    root /var/www/node2/html;
    index index.html;
}
